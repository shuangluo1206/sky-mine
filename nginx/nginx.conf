# 苍穹外卖 · 本机自用 nginx 配置
# 课程自带的 nginx-1.20.2 是 Windows 版（nginx.exe），Mac 上跑不了，
# 所以用 brew 装的 nginx + 这份自己写的配置。
#
# 启动： nginx -p /Users/luoshuangshuang/Downloads/sky-mine/nginx -c /Users/luoshuangshuang/Downloads/sky-mine/nginx/nginx.conf
# 停止： nginx -p /Users/luoshuangshuang/Downloads/sky-mine/nginx -c /Users/luoshuangshuang/Downloads/sky-mine/nginx/nginx.conf -s stop

worker_processes 1;
error_log logs/error.log;
pid       logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    logs/access.log;
    sendfile      on;
    keepalive_timeout 65;

    server {
        # 80 端口在 Mac 上要 sudo，学习环境用 8088
        listen 8088;
        server_name localhost;

        # 管理端前端的静态文件（课程编译好的产物）
        location / {
            root  /Users/luoshuangshuang/Downloads/sky-take-out/nginx-1.20.2/html/sky;
            index index.html;
        }

        # 反向代理：前端发 /api/employee/login
        #          → 后端收 /admin/employee/login
        location /api/ {
            proxy_pass http://localhost:8080/admin/;
        }

        # 用户端（小程序）接口，day06 之后才用到
        location /user/ {
            proxy_pass http://localhost:8080/user/;
        }

        # WebSocket（来单提醒，day10 才用到）
        location /ws/ {
            proxy_pass http://localhost:8080/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
